name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Run pinned static analysis
        run: |
          set -euo pipefail
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -version
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Run every contracted fuzz target independently
        run: go run ./cmd/check-fuzz
      - run: go build ./cmd/agent-runtime
      - name: Cold-compile every supported platform variant
        run: go run ./cmd/check-cold-compile
      - name: Verify module metadata is tidy without mutation
        run: go run ./cmd/check-module-tidy
      - name: Verify every tracked Goal journal against the contract and its schema
        run: go run ./cmd/check-goal-journals
      - run: go run ./cmd/check-ci-contract
      - run: go run ./cmd/check-governance-contract
      - name: Reproduce release bundle without publication
        run: |
          set -euo pipefail
          parent="$(mktemp -d)"
          first="$parent/first"
          second="$parent/second"
          first_result="$parent/first-result.json"
          second_result="$parent/second-result.json"
          trap 'rm -rf -- "$parent"' EXIT
          go run ./cmd/check-release-contract --build --commit HEAD --out "$first" --result "$first_result"
          go run ./cmd/check-release-contract --build --commit HEAD --out "$second" --result "$second_result"
          go run ./cmd/check-release-contract --out "$first" --verify-result "$first_result"
          go run ./cmd/check-release-contract --out "$second" --verify-result "$second_result"
          diff -rq "$first" "$second"

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Record security toolchain
        run: |
          {
            echo "### Security toolchain"
            echo
            echo "- Go: \`$(go version)\`"
            echo "- Scanner: \`golang.org/x/vuln/cmd/govulncheck@v1.7.0\`"
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -version
          } >>"${GITHUB_STEP_SUMMARY}"
      - run: go run ./cmd/check-ci-contract
      - run: go run ./cmd/check-release-contract
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

